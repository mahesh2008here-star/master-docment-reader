name: Build Android APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with APKs?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache & Configure Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching gradle-wrapper.jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package & Name APK Deliverables
        run: |
          mkdir -p release-apks
          # Locate and copy debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release-apks/MasterDocuments-v1.0.0-debug.apk
            echo "Debug APK ready: release-apks/MasterDocuments-v1.0.0-debug.apk"
          fi
          # Locate and copy release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release-apks/MasterDocuments-v1.0.0-release.apk
            echo "Release APK ready: release-apks/MasterDocuments-v1.0.0-release.apk"
          fi
          ls -lh release-apks/

      - name: Upload APKs as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocuments-Android-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/MasterDocuments-v1.0.0-debug.apk
            release-apks/MasterDocuments-v1.0.0-release.apk
            RELEASE.md
          generate_release_notes: true
          name: "Master Documents Release ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false

  build-web:
    name: Build Web Production App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web App
        run: npm run build

      - name: Upload Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocuments-Web-Distribution
          path: dist/
          retention-days: 30
