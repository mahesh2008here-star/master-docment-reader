name: Build Android APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with APKs?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android Project & Wrapper
        working-directory: ./android
        run: |
          echo "Generating official Gradle wrapper with installed Gradle..."
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          ls -la gradle/wrapper/

      - name: Build Android Debug APK
        working-directory: ./android
        shell: bash
        run: |
          set -o pipefail
          echo "Compiling Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log

      - name: Build Android Release APK
        working-directory: ./android
        shell: bash
        run: |
          set -o pipefail
          echo "Compiling Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../android-build.log

      - name: Package & Name APK Deliverables
        if: always()
        run: |
          mkdir -p release-apks
          # Locate and copy debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release-apks/MasterDocuments-v1.0.0-debug.apk
            echo "Debug APK ready: release-apks/MasterDocuments-v1.0.0-debug.apk"
          fi
          # Locate and copy release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release-apks/MasterDocuments-v1.0.0-release.apk
            echo "Release APK ready: release-apks/MasterDocuments-v1.0.0-release.apk"
          fi
          ls -lh release-apks/ || true

      - name: Upload Android Build Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperwren-build-diagnostics-android
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APKs as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocuments-Android-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/MasterDocuments-v1.0.0-debug.apk
            release-apks/MasterDocuments-v1.0.0-release.apk
            RELEASE.md
          generate_release_notes: true
          name: "Master Documents Release ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false

  build-web:
    name: Build Web Production App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Web App
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee web-build.log

      - name: Upload Web Build Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperwren-build-diagnostics-web
          path: web-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterDocuments-Web-Distribution
          path: dist/
          retention-days: 30

